<style>
/* One world: an Ibiza night. Sunset orange argues against sea turquoise; the question sits on a cream playing card. */
:root{
  color-scheme: dark;
  --night:#140b22;
  --deck:#20143a;
  --line:#3d2c5c;
  --cream:#f7eede;
  --ink:#1b1030;
  --muted:#b6a7cc;
  --sun:#ff8a3c;
  --sea:#35d9c6;
  --warn:#ff5d7a;
  --display:"Unbounded","Arial Black",Impact,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 55% at 50% 108%, rgba(255,138,60,.28), transparent 62%),
    radial-gradient(90% 40% at 85% -8%, rgba(53,217,198,.16), transparent 60%),
    var(--night);
  background-attachment:fixed;
  color:var(--cream);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:480px;min-height:100%;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:18px;
}
h1,h2,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

/* Home */
.title{
  font-family:var(--display);font-weight:900;
  font-size:clamp(46px,15vw,72px);line-height:.92;letter-spacing:-.02em;
  text-transform:uppercase;padding-top:10px;
}
.title .no{color:var(--sun);display:block}
.title .dep{position:relative;display:inline-block;color:var(--cream)}
.title .dep::after{
  content:"";position:absolute;left:-3%;right:-3%;top:46%;height:.13em;
  background:var(--sea);transform:rotate(-4deg);border-radius:99px;
}
.mark{width:56px;height:56px;border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.title{padding-top:0}
.tag{font-size:18px;font-weight:500;color:var(--cream);max-width:26em}
.block{display:flex;flex-direction:column;gap:10px}
.label{
  font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:0 14px;border-radius:99px;
  border:1.5px solid var(--line);background:transparent;
  display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;
}
.chip small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.chip[aria-pressed="true"] small{color:#6b5a86}
.chip.player{background:var(--deck)}
.chip.player .x{color:var(--muted);font-size:18px;line-height:1}
.add{display:flex;gap:8px}
.add input{
  flex:1;min-width:0;min-height:48px;padding:0 14px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--deck);
}
.add input::placeholder{color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.how{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:4px;color:var(--cream)}
.how li::marker{color:var(--sun);font-weight:700}

/* Buttons */
.btn{
  min-height:56px;padding:10px 18px;border-radius:16px;border:0;
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--cream);color:var(--ink);width:100%;
}
.btn.sun{background:var(--sun)}
.btn.sea{background:var(--sea)}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line)}
.btn.small{min-height:48px;width:auto;font-size:12px;padding:8px 14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px}
.row > *{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

/* Top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .count{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.link{background:none;border:0;color:var(--muted);font-weight:600;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}

/* The card */
.card{
  background:var(--cream);color:var(--ink);border-radius:24px;
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08);
}
.card.dealt{animation:deal .32s cubic-bezier(.2,.8,.2,1)}
.card.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-1.5deg)}40%{transform:translateX(8px) rotate(1.2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes deal{from{transform:translateY(14px) rotate(-1.2deg)}to{transform:none}}
.card-top{
  display:flex;justify-content:space-between;
  font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#6b5a86;font-variant-numeric:tabular-nums;
}
.q{font-size:clamp(20px,5.6vw,24px);font-weight:600;line-height:1.3;text-wrap:balance}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.side{
  border-radius:16px;padding:12px 12px 14px;min-height:92px;
  display:flex;flex-direction:column;gap:6px;justify-content:flex-end;
  color:var(--ink);
}
.side.a{background:var(--sun)}
.side.b{background:var(--sea);text-align:right;align-items:flex-end}
.side .who{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8;overflow-wrap:anywhere}
.side strong{font-size:18px;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.vs{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);
  width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--cream);
  display:grid;place-items:center;font-family:var(--display);font-size:11px;font-weight:900;
  border:3px solid var(--cream);
}

/* Phases */
.phase{display:flex;flex-direction:column;gap:12px}
.phase h2{font-family:var(--display);font-size:20px;font-weight:900;text-transform:uppercase;line-height:1.1;text-wrap:balance}
.clock{
  font-family:var(--display);font-weight:900;font-size:84px;line-height:1;
  font-variant-numeric:tabular-nums;text-align:center;
}
.clock.a{color:var(--sun)} .clock.b{color:var(--sea)}
.track{height:10px;border-radius:99px;background:var(--deck);overflow:hidden}
.fill{height:100%;transform-origin:left center;border-radius:99px}
.fill.a{background:var(--sun)} .fill.b{background:var(--sea)}
.speaker{text-align:center;font-weight:600}
.depends{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  padding-top:14px;border-top:1px dashed var(--line);
}
.depends span{color:var(--muted);font-size:14px;margin-right:auto}
.pen{
  min-height:44px;padding:0 12px;border-radius:12px;background:transparent;
  border:1.5px solid var(--warn);color:var(--warn);font-weight:700;font-size:14px;
}
.note{color:var(--warn);font-weight:600;font-size:14px}

/* Scores */
.scores{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scores li{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 14px;border-radius:14px;background:var(--deck);font-weight:600;
}
.scores li.top{background:var(--cream);color:var(--ink)}
.scores b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:900;font-size:clamp(34px,11vw,52px);line-height:1;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.big.a{color:var(--sun)} .big.b{color:var(--sea)}
.foot{margin-top:auto;color:var(--muted);font-size:13px;text-align:center;padding-top:8px}

/* Face-down card, final countdown, winner poster */
.card.back{
  background:linear-gradient(160deg,#2b1848,#170c28);color:var(--cream);border:2px solid var(--cream);
  width:100%;min-height:320px;align-items:center;justify-content:center;text-align:center;gap:16px;padding:34px 18px;
}
.card.back img{width:96px;height:96px;border-radius:22px}
.card.back .names{font-family:var(--display);font-weight:900;font-size:20px;text-transform:uppercase;line-height:1.2;overflow-wrap:anywhere}
.card.back .names em{font-style:normal;color:var(--muted);font-size:13px;padding:0 6px}
.card.back .tap{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
.card.flip{animation:flip .42s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(900px) rotateY(88deg) scale(.96)}to{transform:perspective(900px) rotateY(0) scale(1)}}
body[data-tense]::after{
  content:"";position:fixed;inset:0;pointer-events:none;border:8px solid var(--sun);
  animation:tense 1s ease-in-out infinite;
}
body[data-tense="b"]::after{border-color:var(--sea)}
@keyframes tense{0%,100%{opacity:.15}50%{opacity:1}}
body[data-tense] .clock{animation:beat 1s ease-in-out infinite}
@keyframes beat{0%,100%{transform:none}50%{transform:scale(1.12)}}
.poster{
  border-radius:24px;padding:20px 18px 18px;border:1px solid var(--line);
  background:radial-gradient(120% 60% at 50% 118%, rgba(255,138,60,.5), transparent 62%),linear-gradient(160deg,#2b1848,#170c28);
  display:flex;flex-direction:column;gap:14px;
}
.poster-top{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.poster-top img{width:40px;height:40px;border-radius:10px}
.poster .scores li{background:rgba(255,255,255,.07)}
.poster .scores li.top{background:var(--cream)}
.poster-foot{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);opacity:.75;text-align:center;padding-top:4px}

/* Twist + winner burst */
.twist{
  border:1.5px dashed var(--sea);border-radius:16px;padding:10px 14px;background:var(--deck);
  display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:2px;align-items:baseline;transform:rotate(-1deg);
}
.twist span{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sea)}
.twist strong{font-family:var(--display);font-size:14px;font-weight:900;text-transform:uppercase}
.twist p{grid-column:1 / -1;color:var(--cream);font-size:15px}
.burst{position:relative;height:0}
.burst i{
  position:absolute;left:36px;top:26px;width:10px;height:10px;border-radius:3px;background:var(--c);
  opacity:0;animation:pop .9s ease-out forwards;
}
@keyframes pop{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.4)}}
@media (prefers-reduced-motion:reduce){.card.dealt,.card.shake,.card.flip,body[data-tense]::after,body[data-tense] .clock{animation:none}.burst{display:none}}
</style>
</head>

function pickDebaters(){
  const idx=shuffle(S.players.map((_,i)=>i)).sort((x,y)=>S.turns[x]-S.turns[y]);
  let [a,b]=[idx[0],idx[1]];
  // "Loser stays": last round's loser is dealt in again.
  if(S.carry!=null&&S.carry<S.players.length){a=S.carry;b=idx.find(i=>i!==a);}
  S.carry=null;
  if(Math.random()<.5)[a,b]=[b,a];
  S.turns[a]++;S.turns[b]++;
  // A twist lands on every third card.
  S.twist=null;S.secs=SECS;
  if(S.twists&&S.i%3===2){
    const ks=TWISTS.filter(k=>k!==S.lastTwist);
    S.twist=ks[Math.floor(Math.random()*ks.length)];S.lastTwist=S.twist;
    if(S.twist==='half')S.secs=15;
  }
  S.a=a;S.b=b;S.phase='face';S.won=null;S.note='';S.left=S.secs;
}

}

let actx=null,lastWhole=0;
// iPhones mute web sounds when the silent switch is on, and only allow sound after a tap.
// "playback" tells iOS these sounds are the point of the app; every tap wakes the audio up.
function unlock(){
  try{
    if(navigator.audioSession)navigator.audioSession.type='playback';
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state!=='running')actx.resume();
    const src=actx.createBufferSource();src.buffer=actx.createBuffer(1,1,22050);src.connect(actx.destination);src.start(0);
  }catch(e){}
}
document.addEventListener('pointerdown',unlock,{passive:true});
document.addEventListener('touchend',unlock,{passive:true});
function sound(freq,dur,type){
  try{
    if(!actx)unlock();
    if(actx.state!=='running')actx.resume();
    const at=actx.currentTime+.02,o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'triangle';o.frequency.value=freq;
    g.gain.setValueAtTime(.6,at);
    g.gain.exponentialRampToValueAtTime(.001,at+dur);
    o.connect(g);g.connect(actx.destination);o.start(at);o.stop(at+dur+.02);
  }catch(e){}
}
function startTimer(phase){
  sound(660,.12);lastWhole=S.secs;
  S.phase=phase;S.left=S.secs;endAt=Date.now()+S.secs*1000;
  clearInterval(tick);
  tick=setInterval(()=>{
    const l=Math.max(0,(endAt-Date.now())/1000);S.left=l;
    const c=document.getElementById('clock'),f=document.getElementById('fill');
    if(c)c.textContent=Math.ceil(l);
    if(f)f.style.transform='scaleX('+(l/S.secs)+')';
    // Last 5 seconds: a tick each second and a pulsing frame, then a buzzer.
    const w=Math.ceil(l);
    if(w!==lastWhole){lastWhole=w;if(w<=5&&w>0){sound(880,.16);document.body.dataset.tense=S.phase==='t1'?'a':'b';}}
    if(l<=0){sound(196,.8,'sawtooth');try{navigator.vibrate&&navigator.vibrate(350);}catch(e){}endTimer();}
  },100);
}
function endTimer(){
  clearInterval(tick);tick=null;delete document.body.dataset.tense;
  S.phase=S.phase==='t1'?'mid':'vote';render();
}

const ACT={
  add(){
    const el=document.getElementById('name');const v=(el.value||'').trim().slice(0,14);
    if(v&&S.players.length<8&&!S.players.includes(v)){S.players.push(v);keepNames();}
    render();const n=document.getElementById('name');if(n)n.focus();return true;
  },
  remove(v){S.players.splice(+v,1);keepNames();},
  deck(v){S.decks[v]=!S.decks[v];},
  twists(v){S.twists=v==='on';},
  lang(v){if(L[v]){S.lang=v;try{localStorage.setItem('nd-lang',v);}catch(e){}}},
  rounds(v){S.rounds=+v;},
  debate(){startDebate();},
  cards(){startCards();},
  home(){clearInterval(tick);tick=null;delete document.body.dataset.tense;S.screen='home';},
  t1(){startTimer('t1');},
  t2(){startTimer('t2');},
  early(){endTimer();return true;},
  vote(v){
    S.pts=S.twist==='double'?2:1;
    if(v==='a')S.scores[S.a]+=S.pts;
    if(v==='b')S.scores[S.b]+=S.pts;
    if(S.twist==='forfeit'&&v!=='tie')S.carry=v==='a'?S.b:S.a;
    S.won=v;S.phase='result';S.burst=v!=='tie';
  },
  pen(v){
    const i=v==='a'?S.a:S.b;S.scores[i]--;
    const r=t().roasts;S.note=r[Math.floor(Math.random()*r.length)](S.players[i]);S.shake=true;
  },
  next(){
    if(S.i+1>=S.order.length){S.screen='end';S.burst=true;}
    else{S.i++;pickDebaters();}
  },
  finish(){clearInterval(tick);tick=null;delete document.body.dataset.tense;S.screen='end';S.burst=true;},
  flip(){S.phase='deal';S.flipAnim=true;sound(520,.1);},
  again(){startDebate();},
  cnext(){S.i=(S.i+1)%S.order.length;},
  cprev(){S.i=(S.i-1+S.order.length)%S.order.length;}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const done=ACT[b.dataset.act](b.dataset.v);
  if(!done)render();
});
document.addEventListener('submit',e=>{e.preventDefault();ACT.add();});

function cardHTML(c,whoA,whoB){
  const f=face(c),x=t();
  return `<article class="card ${cardAnim}">
    <div class="card-top"><span>${esc(deckName(c[1]))}</span><span>No. ${c[0]}</span></div>
    <p class="q">${esc(f[0])}</p>
    <div class="sides">
      <div class="side a">${whoA?`<span class="who">${esc(whoA)} ${x.argues}</span>`:''}<strong>${esc(f[1])}</strong></div>
      <div class="side b">${whoB?`<span class="who">${esc(whoB)} ${x.argues}</span>`:''}<strong>${esc(f[2])}</strong></div>
      <div class="vs" aria-hidden="true">VS</div>
    </div>
  </article>`;
}
function burstHTML(col){
  return `<div class="burst" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="--a:${i*20+Math.round(Math.random()*14)}deg;--d:${70+Math.round(Math.random()*90)}px;--c:${i%3?col:'var(--cream)'};animation-delay:${Math.round(Math.random()*120)}ms"></i>`).join('')}</div>`;
}
function scoresHTML(){
  const rows=S.players.map((n,i)=>({n,s:S.scores[i]})).sort((x,y)=>y.s-x.s);
  const top=rows[0].s;
  return `<ol class="scores">${rows.map(r=>`<li class="${r.s===top?'top':''}"><span>${esc(r.n)}</span><b>${r.s}</b></li>`).join('')}</ol>`;
}

function home(){
  const x=t(),n=pool().length;const ready=S.players.length>=2&&n>0;
  const counts=Object.fromEntries(CATS.map(c=>[c,CARDS.filter(k=>k[1]===c).length]));
  return `
  <div class="bar">
    <img class="mark" src="icon-192.png" alt="" width="56" height="56">
    <div class="chips" role="group" aria-label="Language / Dil">
      <button class="chip" data-act="lang" data-v="en" aria-pressed="${S.lang==='en'}">English</button>
      <button class="chip" data-act="lang" data-v="tr" aria-pressed="${S.lang==='tr'}">Türkçe</button>
    </div>
  </div>
  <h1 class="title"><span class="no">No</span><span class="dep">Depends</span></h1>
  <p class="tag">${x.tag}</p>
  <ol class="how">${x.how.concat(S.twists?[x.how4]:[]).map(h=>`<li>${h}</li>`).join('')}</ol>
  <section class="block">
    <span class="label">${x.players}</span>
    ${S.players.length?`<div class="chips">${S.players.map((p,i)=>`<button class="chip player" data-act="remove" data-v="${i}" aria-label="${x.remove} ${esc(p)}">${esc(p)}<span class="x" aria-hidden="true">×</span></button>`).join('')}</div>`:''}
    ${S.players.length<8?`<form class="add"><input id="name" maxlength="14" autocomplete="off" placeholder="${x.addName}" aria-label="${x.addName}"><button class="btn small" type="submit">${x.add}</button></form>`:''}
  </section>
  <section class="block">
    <span class="label">${x.deckLabel}</span>
    <div class="chips">${CATS.map(c=>`<button class="chip" data-act="deck" data-v="${esc(c)}" aria-pressed="${S.decks[c]}">${esc(deckName(c))} <small>${counts[c]}</small></button>`).join('')}</div>
  </section>
  <section class="block">
    <span class="label">${x.perGame}</span>
    <div class="chips">${[5,10,15,20].map(r=>`<button class="chip" data-act="rounds" data-v="${r}" aria-pressed="${S.rounds===r}">${r}</button>`).join('')}</div>
  </section>
  <section class="block">
    <span class="label">${x.twistsLabel}</span>
    <div class="chips"><button class="chip" data-act="twists" data-v="on" aria-pressed="${S.twists}">${x.on}</button><button class="chip" data-act="twists" data-v="off" aria-pressed="${!S.twists}">${x.off}</button></div>
  </section>
  <div class="stack">
    <button class="btn sun" data-act="debate" ${ready?'':'disabled'}>${x.start}</button>
    ${ready?'':`<p class="hint">${n?x.hintPlayers:x.hintDecks}</p>`}
    <button class="btn ghost" data-act="cards" ${n?'':'disabled'}>${x.justCards} · ${n}</button>
  </div>
  <p class="foot">${x.foot}${BUILD==="dev"?"":" · v"+BUILD.slice(6,8)+"."+BUILD.slice(4,6)+" "+BUILD.slice(8,10)+":"+BUILD.slice(10,12)}</p>`;
}

function play(){
  const x=t(),c=card(),A=S.players[S.a],B=S.players[S.b];
  const last=S.i+1>=S.order.length;
  if(S.phase==='face')return `
  <div class="bar"><span class="count">${x.card} ${S.i+1} / ${S.order.length}</span><button class="link" data-act="finish">${x.endGame}</button></div>
  <button class="card back ${cardAnim}" data-act="flip">
    <img src="icon-192.png" alt="" width="96" height="96">
    <span class="names">${esc(A)} <em>vs</em> ${esc(B)}</span>
    <span class="tap">${x.tapReveal}</span>
  </button>`;
  let ph='';
  if(S.phase==='deal')ph=`
    <p class="hint">${x.dealHint}</p>
    <button class="btn sun" data-act="t1">${esc(x.startFor(A,S.secs))}</button>`;
  if(S.phase==='mid')ph=`
    <button class="btn sea" data-act="t2">${esc(x.startFor(B,S.secs))}</button>`;
  if(S.phase==='t1'||S.phase==='t2'){
    const k=S.phase==='t1'?'a':'b';
    ph=`<p class="speaker">${esc(x.talking(k==='a'?A:B))}</p>
    <div class="clock ${k}" id="clock" aria-live="off">${Math.ceil(S.left)}</div>
    <div class="track"><div class="fill ${k}" id="fill" style="transform:scaleX(${S.left/S.secs})"></div></div>
    <button class="btn ghost" data-act="early">${x.doneEarly}</button>`;
  }
  if(S.phase==='vote')ph=`
    <h2>${x.whoBetter}</h2>
    <p class="hint">${x.voteHint}</p>
    <div class="row"><button class="btn sun" data-act="vote" data-v="a">${esc(A)}</button><button class="btn sea" data-act="vote" data-v="b">${esc(B)}</button></div>
    <button class="btn ghost" data-act="vote" data-v="tie">${x.tie}</button>`;
  if(S.phase==='result'){
    const w=S.won==='a'?A:S.won==='b'?B:null;
    const bits=S.burst?burstHTML(S.won==='a'?'var(--sun)':'var(--sea)'):'';
    ph=`${bits}<p class="big ${S.won==='tie'?'':S.won}">${w?'+'+S.pts+' '+esc(w):x.tieBig}</p>
    ${scoresHTML()}
    <button class="btn" data-act="next">${last?x.final:x.next}</button>`;
  }
  const pen=S.phase!=='result'?`
    <div class="depends"><span>${x.saidDepends}</span>
      <button class="pen" data-act="pen" data-v="a">${esc(A)} −1</button>
      <button class="pen" data-act="pen" data-v="b">${esc(B)} −1</button>
    </div>${S.note?`<p class="note" role="status">${esc(S.note)}</p>`:''}`:'';
  return `
  <div class="bar"><span class="count">${x.card} ${S.i+1} / ${S.order.length}</span><button class="link" data-act="finish">${x.endGame}</button></div>
  ${S.twist&&S.phase!=='result'?`<div class="twist"><span>${x.twist}</span><strong>${x.tw[S.twist][0]}</strong><p>${x.tw[S.twist][1]}</p></div>`:''}
  ${cardHTML(c,A,B)}
  <div class="phase">${ph}</div>
  ${pen}`;
}

function end(){
  const x=t(),top=Math.max(...S.scores);
  const winners=S.players.filter((_,i)=>S.scores[i]===top);
  return `
  <div class="poster">
    <div class="poster-top"><img src="icon-192.png" alt="" width="40" height="40"><span>No Depends</span></div>
    ${S.burst?burstHTML('var(--sun)'):''}
    <span class="label">${winners.length===1?x.winner:x.isTie}</span>
    <p class="big a">${winners.map(esc).join(' · ')}</p>
    ${scoresHTML()}
    <span class="poster-foot">${x.foot}</span>
  </div>
  <p class="hint">${x.shot}</p>
  <div class="stack">
    <button class="btn sun" data-act="again">${x.again}</button>
    <button class="btn ghost" data-act="home">${x.change}</button>
  </div>`;
}

function cards(){
  const x=t();
  return `
  <div class="bar"><span class="count">${S.i+1} / ${S.order.length}</span><button class="link" data-act="home">${x.home}</button></div>
  ${cardHTML(card())}
  <p class="hint">${x.cardsHint}</p>
  <div class="row"><button class="btn ghost" data-act="cprev">${x.back}</button><button class="btn sun" data-act="cnext">${x.nextCard||x.next}</button></div>`;
}

let cardAnim='',lastKey='';
function render(){
  document.documentElement.lang=S.lang;
  // Deal animation only for a new card; shake only on a "depends" penalty.
  const key=S.screen+':'+S.i+':'+S.order[S.i]+':'+S.lang;
  cardAnim=key!==lastKey?'dealt':(S.shake?'shake':(S.flipAnim?'flip':''));lastKey=key;
  S.shake=false;S.flipAnim=false;
  queueMicrotask(()=>{S.burst=false;});
  if(updateTo)setTimeout(applyUpdate,0);
  app.innerHTML=({home,play,end,cards}[S.screen]||home)();
}
function start(data){
  S=data&&data.screen?data:fresh();
  if(!L[S.lang])S.lang=savedLang();
  if(!S.secs)S.secs=SECS;
  if(S.twists===undefined)S.twists=true;
  if(!S.pts)S.pts=1;
  if(S.phase==='t1')S.phase='deal';
  if(S.phase==='t2')S.phase='mid';
  render();
}
// Self-update: phones keep an installed web app open in the background, so it never reloads by itself.
// Each time the app comes to the front it asks the server for the current version and reloads if it is behind,
// but never in the middle of a game.
let updateTo=null;
function applyUpdate(){
  if(!updateTo||S.screen==='play')return;
  let tried=null;try{tried=sessionStorage.getItem('nd-tried');}catch(e){}
  if(tried===updateTo)return;
  try{sessionStorage.setItem('nd-tried',updateTo);}catch(e){}
  location.replace(location.pathname+'?v='+updateTo);
}
function checkUpdate(){
  if(BUILD==='dev'||location.protocol!=='https:')return;
  fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
    if(j&&j.v&&j.v!==BUILD){updateTo=j.v;applyUpdate();}
  }).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
window.addEventListener('pageshow',checkUpdate);
// Works offline once opened on its own address. Skipped inside a viewer frame.
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
</html>
